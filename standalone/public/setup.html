<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次设置 · Judy Math AI</title><link rel="stylesheet" href="/auth.css"></head><body data-auth-screen="setup"><main class="auth-card"><div class="brand">j<span>✦</span></div><p class="eyebrow">仅需设置一次</p><h1>建立家庭学习空间</h1><p class="intro">请由家长在自己的服务器完成设置。设置码在服务器安全配置中生成，不需要发到聊天里。</p><form id="auth-form"><label for="setup-token">首次设置码</label><input id="setup-token" name="setup-token" type="password" autocomplete="off" required minlength="32" maxlength="256"><label for="parent-password">家长管理密码</label><input id="parent-password" name="parent-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label for="student-password">Judy 学习密码</label><input id="student-password" name="student-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><p class="small">两组密码需不同，每组至少 12 个字符，可使用容易记住的长口令。</p><button id="submit" type="submit">保存家庭密码</button><p id="auth-message" role="status" aria-live="polite"></p></form></main><script type="module" src="/auth-screen.js"></script></body></html>
